playground:
  title: Admin Playground — ephemeral provider test console
  decisions:
    - base_url_policy: registry default + session-only override. Registry URL prefilled; Customize allows a one-off chat URL edit for the current test. Cron/scheduler always use the registry. Custom URLs must pass assertSafeApiUrl (https-only, no creds) and are never stored.
    - session_overrides: optional apiKey (tab-only, sessionStorage, REDACTED from logs) and chatUrl (ephemeral field, reset on provider switch) apply to the single request only. Provider name is still always sent and must be a known registry provider.
    - persistence: no D1 writes (no benchmark_runs, no hourly, no incidents, no config). Results held in React state only, cleared on refresh. Sole D1 write is the existing audit_log middleware row.
    - presets: localStorage only. No migration, no preset endpoint.
    - token budget: max_tokens ceiling 2048 (not 512) so reasoning models have
      thinking headroom; the 60s timeout still bounds cost. reasoning_no_content
      surfaces a retry-with-more-tokens hint in the UI instead of a bare error.
  backend:
    endpoint: POST /api/admin/playground/test
    download: frontend Download debug log (.json) button assembles {exported_at, ui params, result, answer_preview, debug} into a Blob file playground-<provider>-<model>-<ts>.json; hidden when debug absent
    auth: isAdmin first line; mounted under /api/admin/* for 30/min limit + recordAudit
    request: { provider, provider_model_id, prompt, system?, temperature?, top_p?, max_tokens?, timeout_ms?, apiKey?, chatUrl? }
    clamps: { prompt: 1-4000 chars, system: <=4000, temperature: 0-2, top_p: 0-1, max_tokens: 16-2048, timeout_ms: 5000-60000, apiKey: string<=500, chatUrl: string 8-500 }
    resolution: providerFor(name, env) must exist; chat URL = caller chatUrl override (after assertSafeApiUrl) else registry exact-match; key = caller apiKey override else adapter env key. apiUrl/baseUrl/extraHeaders/headers from client still rejected (400).
    execution: provider.benchmarkModel(model, { type: coding, prompt, max_tokens, timeout_ms, temperature?, top_p?, system_prompt? }) direct; no BENCH_QUEUE.send; no LIVE_DO.publish; no insertBenchmarkRun.
    response: { ok, provider, model, resolvedChatUrl, custom_url_used, free_status, would_queue_in_cron, result: BenchmarkResult, preview: string<=2000 sanitized, debug: PlaygroundDebug|null }
    debug_bundle: { request: { method, url, headers REDACTED, body }, response: { http_status, headers, body_preview<=2000 (non-OK only), sse_lines, sse_preview<=50x500, reasoning_seen }, reproduce_hint (curl template with $PROVIDER_API_KEY placeholder) }
    secrecy: redactHeaders() replaces authorization/api-key/token/secret/cookie/session values with REDACTED; route test asserts serialized response never contains the server key
    free_display: DB lookup models+providers for free_status/active/benchmark_enabled; would_queue = FREE + active + enabled. PAID run allowed ephemeral with warning; scheduler gate unchanged.
  engine:
    change: BenchmarkDefinition gains optional temperature/top_p/system_prompt; measureBenchmark includes them in chat body when defined + optional system message. Backward compatible.
  frontend:
    location: Admin tabs [Benchmark Control | Playground]
    components: provider Select (registry; switching clears model + auto-picks first active/FREE model for the new provider and resets custom URL), model Combobox (admin models), endpoint registry default + Customize/Reset one-off override + Copy log on preview, params FieldGroup (temperature/top_p sliders, max_tokens, timeout Select, stream note, system Textarea), prompt Textarea + preset Select (coding-default + short/reasoning/multilingual/timeout probes, custom in localStorage), Run/Cancel (AbortController, Cmd+Enter, Esc), results Card (TTFT/TPS/generation/ITL/chunks/tokens/method/status/http + Badge + Tabs [Answer|Request JSON] + warning when PAID/UNKNOWN), internal API probe (GET /api/health|providers|models|leaderboard) in collapsible section
    a11y: FieldLabel htmlFor, aria-invalid/data-invalid, role=alert errors, aria-live polite results, focus-visible, >=24px targets, reduced-motion
    perf: lazy import Playground inside Admin Suspense; no new deps
  tests:
    - test/playground.test.ts: validatePlaygroundInput clamps/rejects; engine includes temperature/system in body (mock fetch); route 401 without token, 400 unknown provider, 400 bad prompt; no DB/queue/DO imports in playground route
    - preflight: npm test && npm run typecheck && npm run lint green
  never:
    - never accept apiUrl/baseUrl/extraHeaders/headers from client; never persist session overrides (apiKey/chatUrl) or echo keys
    - never allow non-https or credentialed custom URLs (assertSafeApiUrl); never let custom URLs affect cron/scheduler
    - never store response bodies (preview in-memory only)
    - never set benchmark_enabled to allow PAID; never change scheduler free gate
    - never use total duration for TPS; reuse computeTPS generation window
