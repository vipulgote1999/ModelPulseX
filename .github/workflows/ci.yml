# ModelPulseX CI — lint + tests + typecheck on every push/PR.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests (vitest)
        run: npm test
      - name: Typecheck
        run: npm run typecheck

  # Deploy job intentionally absent: production deploys run via `npm run deploy`
  # from an authenticated environment (wrangler) — see deploy.bat / README ops.
