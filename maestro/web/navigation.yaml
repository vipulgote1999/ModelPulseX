url: https://modelpulsex.pages.dev
name: Primary navigation reaches every page
tags:
  - web
  - navigation
---
- clearState
- openLink: https://modelpulsex.pages.dev/?nav=1#/
- extendedWaitUntil:
    visible: "BEST OVERALL · 7D"
    timeout: 30000
- runFlow:
