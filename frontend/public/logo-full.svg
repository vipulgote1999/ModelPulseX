<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 72" role="img" aria-label="ModelPulseX — LLM Performance Observatory">
  <defs>
    <!-- userSpaceOnUse over the mark's own extent, so both arms share one
         continuous colour field and the crossing has no seam. See logo.svg. -->
    <linearGradient id="mpx-lg" gradientUnits="userSpaceOnUse" x1="11" y1="11" x2="53" y2="53">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <!-- The wordmark sits far outside the mark's coordinate range, so it keeps
         its own per-element (objectBoundingBox) ramp exactly as before. -->
    <linearGradient id="mpx-lg-wm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="64" height="64" rx="15" fill="#0B0B12" stroke="#8B5CF6" stroke-opacity="0.35" stroke-width="1.5"/>
  <g transform="translate(2,2)">
    <g transform="translate(32,32) scale(1.1) translate(-32,-32)">
    <circle cx="32" cy="32" r="21" fill="none" stroke="url(#mpx-lg)" stroke-width="2.6" stroke-linecap="round" opacity="0.55" stroke-dasharray="112 20" transform="rotate(53 32 32)"/>
    <path d="M16.03 21.97 L42.03 47.97 A4.2 4.2 0 0 0 47.97 42.03 L21.97 16.03 A4.2 4.2 0 0 0 16.03 21.97 Z" fill="url(#mpx-lg)"/>
    <path d="M17.654 47.433 L28.654 35.433 A3.6 3.6 0 0 0 29.343 34.337 L29.693 33.462 L30.585 36.138 A3.6 3.6 0 0 0 36.626 37.462 L51.626 21.462 A3.6 3.6 0 0 0 46.374 16.538 L35.505 28.131 L33.415 21.862 A3.6 3.6 0 0 0 26.657 21.663 L22.902 31.052 L12.346 42.567 A3.6 3.6 0 0 0 17.654 47.433 Z" fill="url(#mpx-lg)"/>
    </g>
  </g>
  <text x="82" y="36" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="700" letter-spacing="-0.5" fill="#F4F4F5">ModelPulse<tspan fill="url(#mpx-lg-wm)">X</tspan></text>
  <text x="83" y="56" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="600" letter-spacing="2.1" fill="#A1A1AA">LLM PERFORMANCE OBSERVATORY</text>
</svg>
