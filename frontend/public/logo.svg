<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ModelPulseX logo">
  <defs>
    <!-- userSpaceOnUse over the mark's own extent. Spans exactly the orbit
         ring's bbox, so the ring is pixel-identical to the old
         objectBoundingBox mapping, but now BOTH arms read the SAME colour
         field. Per-element bbox gradients gave each arm a differently
         stretched violet->cyan ramp, which showed as a hard seam at the
         crossing. -->
    <linearGradient id="mpx-g" gradientUnits="userSpaceOnUse" x1="11" y1="11" x2="53" y2="53">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0B0B12" stroke="#8B5CF6" stroke-opacity="0.35" stroke-width="1.5"/>
  <g transform="translate(32,32) scale(1.1) translate(-32,-32)">
  <!-- observatory orbit ring, gapped top-right where the pulse arm exits -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="url(#mpx-g)" stroke-width="2.6" stroke-linecap="round" opacity="0.55" stroke-dasharray="112 20" transform="rotate(53 32 32)"/>
  <!-- Solid X arm (v3: thick round-4 weight). Each d below is the exact stroke
       outline of the arm's centreline: 8.4px wide, round caps, round joins.
       filled rather than stroked, so the mark is geometry and not dependent on
       how a renderer paints a stroke. -->
  <path d="M16.03 21.97 L42.03 47.97 A4.2 4.2 0 0 0 47.97 42.03 L21.97 16.03 A4.2 4.2 0 0 0 16.03 21.97 Z" fill="url(#mpx-g)"/>
  <!-- pulse X arm: straight diagonal, one first-token spike (7.2px, round joins) -->
  <path d="M17.654 47.433 L28.654 35.433 A3.6 3.6 0 0 0 29.343 34.337 L29.693 33.462 L30.585 36.138 A3.6 3.6 0 0 0 36.626 37.462 L51.626 21.462 A3.6 3.6 0 0 0 46.374 16.538 L35.505 28.131 L33.415 21.862 A3.6 3.6 0 0 0 26.657 21.663 L22.902 31.052 L12.346 42.567 A3.6 3.6 0 0 0 17.654 47.433 Z" fill="url(#mpx-g)"/>
  </g>
</svg>
